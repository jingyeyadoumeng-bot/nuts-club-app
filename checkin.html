<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b111a"><title>来店チェックイン | NUTS CLUB</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at top,#263347,#080d15 70%);color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:22px}.card{width:min(100%,440px);border:1px solid #8a7148;border-radius:20px;padding:34px 26px;background:linear-gradient(150deg,#1c2837,#0d131d);box-shadow:0 22px 65px #0009}.brand{font:700 24px Georgia,serif;letter-spacing:.19em;color:#f4d7a2;text-align:center}.line{height:1px;background:linear-gradient(90deg,transparent,#b79a68,transparent);margin:25px 0}h1{text-align:center;font-size:25px;letter-spacing:.08em}p{color:#d1dae5;line-height:1.7;text-align:center}button,a.action{display:block;width:100%;border:0;border-radius:12px;padding:16px;margin:18px 0 0;background:#e7c78c;color:#141b25;font-size:16px;font-weight:800;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.small{font-size:12px;color:#aebac8}#status{min-height:50px;font-weight:700}a{color:#f5d6a2}</style></head><body><main class="card"><div class="brand">♠ NUTS CLUB</div><div class="line"></div><h1>来店チェックイン</h1><p>店舗のQRコードから来店登録できます。<br>会員ログインが必要です。</p><p id="status" role="status" aria-live="polite">ログイン状態を確認しています…</p><button id="check" hidden>チェックインする</button><a class="action" id="login" href="/member.html" hidden>会員ログインへ</a><p class="small">店舗に設置されたQRコードからアクセスしてください。<br>チェックインは1回の来店につき1回です。</p></main><script>
(function(){
 const params=new URLSearchParams(location.search);
 const code=params.get('code');
 const status=document.getElementById('status'),btn=document.getElementById('check'),login=document.getElementById('login');
 let session;try{session=JSON.parse(localStorage.getItem('nuts_session')||'{}')}catch(e){}
 if(!code){status.textContent='有効な店舗QRコードを読み取ってください。';return}
 if(!session?.access_token){status.textContent='会員ログイン後、もう一度QRコードを読み取ってください。';login.hidden=false;return}
 status.textContent='会員情報を確認できました。下のボタンで来店登録してください。';btn.hidden=false;
 btn.addEventListener('click',async()=>{
  btn.disabled=true;status.textContent='チェックイン中…';
  try{
   const res=await fetch('https://ixjnfzgkohmkukxqsfts.supabase.co/rest/v1/rpc/nuts_member_self_checkin',{method:'POST',headers:{'Content-Type':'application/json',apikey:'sb_publishable_A9lCkz5EUwXYsuFiiV-p3Q__yveeQQr',Authorization:'Bearer '+session.access_token},body:JSON.stringify({p_code:code})});
   const data=await res.json().catch(()=>null);
   if(!res.ok)throw Error(res.status===401?'ログイン期限が切れています。会員アプリで再ログインしてください。':(data?.message||'チェックインできませんでした'));
   if(data==='checked_in'){status.textContent='✓ チェックイン完了！ご来店ありがとうございます。';btn.hidden=true}
   else if(data==='already_checked_in'){status.textContent='✓ すでにチェックイン済みです。';btn.hidden=true}
   else throw Error('確認できない応答です');
  }catch(e){status.textContent=e.message;btn.disabled=false}
 });
})();
</script></body></html>
