<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUTS CLUB | チケット消し込み</title><style>body{background:#0b0c10;color:#f6f1e7;font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:560px;margin:auto;padding:24px}h1,.gold{color:#d9b875}.card{background:#191b21;border:1px solid #56472e;border-radius:16px;padding:18px;margin:18px 0}input,button{font-size:16px;padding:12px;border-radius:9px;margin:8px 0;width:100%;box-sizing:border-box}input{background:#282a31;border:1px solid #5a5a60;color:white}button{background:#d9b875;border:0;color:#141414;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.muted{color:#b7b2a9}.danger{color:#ffb8a6}</style></head><body><h1>♠ NUTS CLUB</h1><p class="muted">STAFF / チケット消し込み</p><section class="card" id="login"><h2>スタッフログイン</h2><input type="email" id="email" placeholder="メールアドレス"><input type="password" id="password" placeholder="パスワード"><button id="signin">ログイン</button></section><section class="card" id="workspace" hidden><h2>チケット発行</h2><p class="muted">会員IDとチケット種類IDを入力してください。</p><input id="memberId" placeholder="会員ID（お客様の会員画面に表示）"><select id="ticketTypeId" style="width:100%;padding:12px;background:#282a31;color:white;border:1px solid #5a5a60;border-radius:9px"><option value="">チケット種類を選択</option></select><button id="issue">チケットを発行</button><hr style="border-color:#56472e"><h2>チケット使用処理</h2><p class="muted">お客様のチケットIDを入力し、確認後に使用済みにします。</p><input id="ticketId" type="number" min="1" step="1" placeholder="チケットID"><button id="redeem">使用済みにする</button><button id="signout" style="background:#3b3b40;color:white">ログアウト</button></section><p id="status" role="status"></p><script src="/staff.js"></script></body></html>
