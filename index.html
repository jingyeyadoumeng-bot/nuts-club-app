a64',icon:'♛'},{name:'PLATINUM',min:30,color:'#c5e5f3',icon:'♛'},{name:'BLACK VIP',min:50,color:'#c6a1ff',icon:'♛'}];function memberTier(){return [...tiers].reverse().find(t=>state.visits>=t.min)||tiers[0]}function tierClass(t){return t.name.toLowerCase().replace(' ','-')}function vipPlastic(t,mini=false){return `<div class="vip-card ${tierClass(t)} ${mini?'mini':''}"><div class="vip-top"><div><div class="vip-crown">♛</div><div class="vip-tier">${t.name}</div><div class="vip-sub">NUTS CLUB MEMBER</div></div><div class="vip-logo">♠ NUTS</div></div><div class="vip-foot"><span>${esc(state.name)}</span><span>MEMBER · DEMO</span></div></div>`}function memberCard(){let t=memberTier(),i=tiers.indexOf(t),n=tiers[i+1],pct=n?Math.min(100,Math.round(state.visits/n.min*100)):100;return `<section style="margin:18px 0"><button class="vip-card-button" onclick="go('vip')" aria-label="会員カードを開く">${vipPlastic(t)}</button><div class="vip-progress"><div class="row small"><span class="muted">${n?'次のランク '+n.name:'最高ランク達成'}</span><strong>${n?'あと'+(n.min-state.visits)+'回来店':'VIP MAX'}</strong></div><div class="questbar"><div style="width:${pct}%"></div></div><div class="row small muted" style="margin-top:6px"><span>累計 ${state.visits}回来店</span><span>${n?state.visits+' / '+n.min:'50 / 50'}回</span></div></div></section>`}function home(){return `<div class="hero"><h1>YOUR NEXT HAND<br>STARTS HERE.</h1><p>週末は、THE NUTSで。</p></div>${card('NEXT TOURNAMENT',`<div class="row"><div><strong style="font-size:21px">${live.tournament}</strong><div class="gold" style="margin-top:9px">${live.time} START</div></div><button class="btn" onclick="join()">${state.joined?'予約済み':'ENTRY'}</button></div>`)}<div class="two"><div class="card"><div class="eyebrow">MY RANK</div><div class="big gold">#12</div><div class="muted small">月間順位（サンプル）</div></div><div class="card"><div class="eyebrow">MY POINTS</div><div class="big gold">${state.points}</div><div class="muted small">デモポイント</div></div></div>${memberCard()}${card('VISIT CHECK-IN',`<div class="row"><div><strong>♠ 来店QRスタンプ</strong><div class="muted small">スタッフ確認で来店回数を記録（デモ）</div></div><button class="btn" onclick="go('checkin')">QRを表示</button></div>`)}${card('MONTHLY LEADERBOARD',rankList()+`<button class="link" onclick="go('rank')">ランキングをすべて見る →</button>`)}${card('NUTS LIVE',`<div class="row"><div><div class="big">${live.players}<span class="small muted"> 人</span></div><div class="muted small">現在の参加人数（サンプル）</div></div><button class="btn secondary" onclick="go('live')">状況を見る</button></div>`)}${card('NUTS QUEST',`<div class="row"><span>来店ミッションに挑戦</span><button class="btn secondary" onclick="go('quest')">見る →</button></div>`)}<div class="quick-actions"><button onclick="go('events')"><span>♠</span>イベント</button><button onclick="go('vip')"><span>♛</span>VIPカード</button><button onclick="go('history')"><span>◷</span>来店履歴</button></div>`}
let rankPeriod='monthly';const rankData={monthly:{title:'MONTHLY RANKING',sub:'今月の活動ポイント',rows:[['ATOM',1250],['TAKU',820],['RYO',640],['KEN',580],['YUTA',420],['SORA',360],['REN',280]]},yearly:{title:'YEARLY RANKING',sub:'年間の活動ポイント',rows:[['TAKU',9200],['ATOM',8700],['RYO',7450],['YUTA',6300],['KEN',5900],['REN',4700],['SORA',3500]]},visits:{title:'VISIT RANKING',sub:'累計来店回数',rows:[['RYO',82],['ATOM',67],['TAKU',54],['KEN',48],['SORA',37],['YUTA',31],['REN',22]]}};function chooseRank(k){rankPeriod=k;render()}function rank(){const d=rankData[rankPeriod],unit=rankPeriod==='visits'?'回':'PT',colors=['#d6dce4','#f4c969','#bf9073'];let order=[1,0,2];let podium=order.map((ix)=>{let [name,num]=d.rows[ix];return `<div class="podium-col" style="--metal:${colors[ix]};--height:${ix===0?136:ix===1?110:93}px"><div class="podium-crown">${ix===0?'♛':'♠'}</div><div class="podium-avatar">${ix===0?'♛':'♠'}</div><div class="podium-name">${esc(name)}</div><div class="podium-pts">${num.toLocaleString()} ${unit}</div><div class="podium-step"><strong>${ix+1}</strong><span>${ix===0?'CHAMPION':ix===1?'RUNNER UP':'THIRD'}</span></div></div>`}).join('');let others=d.rows.slice(3).map(([name,num],i)=>`<div class="ranking-row"><span class="place">${i+4}</span><span class="name">${esc(name)}</span><span class="pts">${num.toLocaleString()} ${unit}</span></div>`).join('');return `<div class="ranking-head"><div class="eyebrow" style="color:#c8a766">♠ NUTS CLUB / HALL OF FAME</div><h1>🏆 ${d.title}</h1><div class="muted small">${d.sub} · TOP PLAYERS</div></div><div class="rank-switch"><button class="${rankPeriod==='monthly'?'active':''}" onclick="chooseRank('monthly')">月間</button><button class="${rankPeriod==='yearly'?'active':''}" onclick="chooseRank('yearly')">年間</button><button class="${rankPeriod==='visits'?'active':''}" onclick="chooseRank('visits')">来店回数</button></div><div class="podium">${podium}</div>${card('RANKING 04–07',others)}${card('MY STATUS',`<div class="row"><div><div class="big gold">${state.points.toLocaleString()} PT</div><div class="muted small">自分のデモポイント</div></div><div><div class="big gold">${state.visits} 回</div><div class="muted small">累計来店（デモ）</div></div></div>`)}<p class="ranking-note">※順位・名前・数値はすべて画面確認用のサンプルです。実際のランキング共有は未実装です。ポイントは現金・チップ等と交換できません。今後は来店・イベント参加などの活動を基準にします。</p>`}
function liveView(){return `<h1 class="h1">◉ NUTS LIVE</h1><p class="muted">今夜のナッツを、来店前にチェック。</p><div class="live-banner"><span class="live-badge"><i class="live-dot"></i> NUTS FLOOR STATUS</span><h2 style="font-family:Georgia,serif;letter-spacing:1.2px;font-size:28px;margin:18px 0 6px">THE NIGHT IS YOURS.</h2><p class="muted small" style="margin:0">ポーカー・ダーツ・麻雀を楽しもう</p></div><div class="live-note">現在はデモ画面です。以下の人数・卓数・空き状況はサンプルで、実際の店舗情報ではありません。</div><div class="live-metrics"><div class="live-metric"><small>♠ POKER PLAYERS</small><strong>${live.players}<span style="font-size:14px"> 人</span></strong><small>表示例・未連携</small></div><div class="live-metric"><small>♣ ACTIVE TABLES</small><strong>${live.tables}<span style="font-size:14px"> / 3 卓</span></strong><small>表示例・未連携</small></div></div>${card('FLOOR GUIDE · サンプル',`<div class="live-status"><span>♠ ポーカー</span><b>${live.tables}卓稼働（例）</b></div><div class="live-status"><span>🎯 ダーツ</span><b>${live.darts}（例）</b></div><div class="live-status"><span>🀄 麻雀</span><b>${live.mahjong}（例）</b></div>`)}${card('NEXT TOURNAMENT · 予定例',`<div class="row"><div><strong style="font-size:18px">${live.tournament}</strong><div class="gold" style="margin-top:8px">${live.time} START</div></div><span class="pill">DEMO</span></div><p class="live-fine">日時・開催状況は店頭でご確認ください。ここからの操作は実際の予約になりません。</p><button class="btn" onclick="go('events')">イベント一覧を見る →</button>`)}${card('WEEKEND SPECIAL',`<strong style="font-size:20px;color:var(--gold)">🐍 HABU NIGHT</strong><p class="muted small">週末限定イベントを企画中</p><p class="live-fine">ポーカーの特別ルールを楽しむ企画。飲酒は任意で、ノンアル演出にも対応する予定です。</p>`)}${card('HOW TO USE NUTS LIVE',`<div class="live-steps"><div class="live-step"><span>1</span><div>今夜の卓数やイベント情報をチェック</div></div><div class="live-step"><span>2</span><div>気になるイベントを保存</div></div><div class="live-step"><span>3</span><div>店舗で実際の開催状況を確認して来店</div></div></div>`)}<p class="notice">本番版では、店舗側の更新とデータベース連携により、実際の人数・卓数を表示する予定です。</p>`}function join(){state.joined=!state.joined;save();notify(state.joined?'デモ予約を登録しました':'デモ予約を取り消しました');render()}
const quests=[{id:'visit3',title:'来店3回を達成',desc:'来店スタンプを3つ集めよう',need:3,pt:100},{id:'visit5',title:'来店5回を達成',desc:'常連プレイヤーへの第一歩',need:5,pt:200}];function quest(){return `<h1 class="h1">✨ NUTS QUEST</h1><p class="muted">遊ぶほど、思い出と称号が増える。</p>${card('VISIT STAMPS',`<div class="row"><div><div class="big gold">${state.visits} <span class="small muted">VISITS</span></div><p class="small muted">デモ用の来店記録</p></div><button class="btn secondary" onclick="go('checkin')">来店QRを表示</button></div>`)}${quests.map(q=>card('MISSION',`<div class="row"><strong>${q.title}</strong><span class="pill">+${q.pt} PT</span></div><p class="muted small">${q.desc}</p><div class="questbar"><div style="width:${Math.min(100,state.visits/q.need*100)}%"></div></div><p class="small muted">${Math.min(q.need,state.visits)} / ${q.need}</p><button class="btn" ${state.visits<q.need||state.claimed.includes(q.id)?'disabled':''} onclick="claim('${q.id}')">${state.claimed.includes(q.id)?'受け取り済み':'ポイントを受け取る'}</button>`)).join('')}<p class="notice">※来店記録・ポイントはデモです。本番ではスタッフによる来店確認を導入します。</p>`}function demoVisit(){const today=new Date().toLocaleDateString('sv-SE');if(state.lastDemoVisit===today)return notify('今日はすでにスタンプを記録済みです');if(!confirm('【デモ用】スタッフが来店を確認しましたか？\n※実際の店舗では使えないテスト機能です。'))return;state.visits++;state.lastDemoVisit=today;state.visitHistory.push(today);save();notify('デモ来店スタンプを記録しました');render()}function claim(id){let q=quests.find(x=>x.id===id);if(!q||state.visits<q.need||state.claimed.includes(id))return;state.points+=q.pt;state.claimed.push(id);save();notify('ポイントを獲得しました！');render()}
function match(){return `<h1 class="h1">♠ NUTS MATCH</h1><p class="muted">一緒に遊ぶ仲間を見つけよう。</p>${card('仲間を募集する',`<label class="small muted">募集するゲーム</label><select class="field" id="game"><option>ポーカー</option><option>麻雀</option><option>ダーツ</option></select><label class="small muted">メッセージ</label><input class="field" id="msg" maxlength="70" placeholder="例：今夜21時から一緒に遊べる人！"><button class="btn" onclick="post()">募集を投稿</button>`)}${card('みんなの募集',state.posts.length?state.posts.slice().reverse().map((p,i)=>`<div class="item"><span class="pill">${esc(p.game)}</span><div style="margin:9px 0">${esc(p.msg)}</div><div class="row"><span class="muted small">${esc(p.name)} · デモ投稿</span><button class="link" onclick="reply()">参加したい</button></div></div>`).join(''):'<p class="muted">まだ募集はありません。最初の募集を投稿してみよう！</p>')}<p class="notice">※投稿はこの端末内だけに保存されます。他のユーザーには公開されません。</p>`}function post(){let msg=$('#msg').value.trim();if(!msg)return notify('メッセージを入力してね');state.posts.push({game:$('#game').value,msg,name:state.name});save();notify('デモ募集を投稿しました');render()}function reply(){notify('参加連絡は本番版で使えるようにする予定です')}
let selectedTier=null;function selectTier(i){selectedTier=i;go('vip')}function vip(){let t=memberTier(),selected=selectedTier===null?t:tiers[selectedTier];let benefits=['会員登録・来店スタンプ開始','会員限定のお知らせ（予定）','誕生日特典・イベント先行案内（予定）','限定グッズ・特別イベント案内（予定）','BLACK VIP限定の特別招待（予定）'];return `<h1 class="h1" style="color:var(--gold);font-family:Georgia,serif;text-align:center">♛ NUTS VIP</h1><p class="muted" style="text-align:center">来店するほど、会員カードが進化する。</p>${memberCard()}<button class="btn" style="width:100%;margin-bottom:15px" onclick="go('checkin')">▦ 来店QR会員証を表示</button><div class="vip-section-title">MEMBERSHIP CARDS</div><p class="small muted">カードをタップするとランク詳細が見られるよ。</p><div class="vip-tiers">${tiers.map((x,i)=>`<button class="vip-card-button" onclick="selectTier(${i})" aria-label="${x.name}の詳細">${vipPlastic(x,true)}<div class="row small" style="padding:0 4px 10px"><span class="muted">${x.min===0?'会員登録':`累計${x.min}回来店`}</span><span style="color:${x.color}">${state.visits>=x.min?'✓ 達成':`あと${x.min-state.visits}回`}</span></div></button>`).join('')}</div><div class="vip-section-title">RANK DETAILS</div><div class="vip-detail"><div class="row"><strong style="font-size:21px;color:${selected.color}">${selected.name}</strong><span class="pill">${selected.min===0?'登録時':selected.min+'回来店'}</span></div><div class="item">♛ ${benefits[tiers.indexOf(selected)]}</div><p class="notice">特典は企画中の案で、現在は提供していません。</p></div><p class="notice">※デモ版。来店回数・ランクは端末内のみ保存されます。勝敗・チップ購入額によってランクは変わりません。</p>`}function checkin(){const today=new Date().toLocaleDateString('sv-SE'),done=state.lastDemoVisit===today;return `<h1 class="h1" style="text-align:center;color:var(--gold)">♠ VISIT CHECK-IN</h1><p class="muted" style="text-align:center">来店スタンプ · QR会員証</p><div class="checkin-card"><div class="eyebrow">NUTS CLUB MEMBER</div><strong style="font-size:22px">${esc(state.name)}</strong><div class="small gold" style="margin-top:8px">${memberTier().name} MEMBER</div><div class="qr-frame"><img alt="デモ会員QRコード" src="${demoQRs[state.demoMemberIndex]}"></div><div class="checkin-id">DEMO-${String(state.demoMemberIndex+1).padStart(4,'0')}</div><p class="muted small">来店時にスタッフにこの画面を見せよう</p><div class="row" style="margin-top:18px"><span>累計来店</span><strong class="gold">${state.visits} 回</strong></div></div>${card('来店確認の流れ',`<div class="checkin-step">① お客さんがQR会員証を表示</div><div class="checkin-step">② スタッフが会員証と来店を確認</div><div class="checkin-step">③ スタッフがスタンプを付与</div><p class="checkin-warning">※現在は端末内だけのデモです。QRを読み取るスタッフ用アプリ・本人認証・不正防止・店舗データ連携は未実装です。</p><button class="btn" style="width:100%" onclick="demoVisit()" ${done?'disabled':''}>${done?'✓ 本日のデモスタンプ記録済み':'スタッフ確認済みとしてデモスタンプを付与'}</button><p class="notice">このボタンは操作確認専用です。本番ではスタッフだけが操作できる管理画面に置きます。</p>`)}<button class="btn secondary" onclick="go('vip')">VIPカードに戻る →</button>`}

const events=[{id:'weekend',title:'WEEKEND POKER',when:'週末 21:00',tag:'POKER',desc:'通常トーナメント。開催日時・料金は店頭でご確認ください。'},{id:'habu',title:'HABU NIGHT',when:'週末開催を検討中',tag:'SPECIAL',desc:'フォールドしても最後まで楽しめる特別ルール。敗者演出はノンアル対応。企画段階です。'},{id:'beginner',title:'BEGINNER SESSION',when:'日程調整中',tag:'BEGINNER',desc:'初めての方も楽しめる体験企画。開催は未確定です。'}];
function eventView(){return `<h1 class="h1">♠ NUTS EVENTS</h1><p class="muted">週末の楽しみを見つけよう。</p><div class="demo-banner">これは体験版の予定リストです。参加登録はこの端末にだけ保存され、お店への予約・連絡にはなりません。</div>${events.map(e=>`<div class="event-row"><span class="event-label">${e.tag} · DEMO</span><h3>${e.title}</h3><div class="gold small">◷ ${e.when}</div><p>${e.desc}</p><div class="row"><span class="muted small">${state.bookings.includes(e.id)?'✓ 興味ありに登録済み':'気になるイベントを保存'}</span><button class="btn ${state.bookings.includes(e.id)?'secondary':''}" onclick="toggleEvent('${e.id}')">${state.bookings.includes(e.id)?'解除':'興味あり ♡'}</button></div></div>`).join('')}${card('保存したイベント',state.bookings.length?state.bookings.map(id=>`<div class="item">♠ ${events.find(e=>e.id===id)?.title||'EVENT'}</div>`).join(''):'<p class="muted small">まだ保存したイベントはありません。</p>')}</div>`}
function toggleEvent(id){if(!events.some(e=>e.id===id))return;state.bookings=state.bookings.includes(id)?state.bookings.filter(x=>x!==id):[...state.bookings,id];save();notify('この端末に保存しました（予約ではありません）');render()}
function historyView(){let entries=state.visitHistory.slice().reverse();return `<h1 class="h1">◷ VISIT HISTORY</h1><p class="muted">あなたのNUTS CLUBでの思い出</p>${memberCard()}${card('来店記録',`<div class="row"><span>累計来店回数（デモ）</span><strong class="gold">${state.visits} 回</strong></div><p class="notice">現在の累計には初期サンプル値が含まれます。</p>${entries.length?entries.map(d=>`<div class="history-entry"><strong>♠ 来店スタンプ</strong><small>${esc(d)} · この端末で記録</small></div>`).join(''):'<p class="muted small">この端末で追加した来店履歴はまだありません。</p>'}`)}<button class="btn secondary" onclick="go('checkin')">QR会員証を表示 →</button>`}

function player(){return `<h1 class="h1">♙ NUTS PLAYER</h1>${card('MY PROFILE',`<label class="small muted">表示名</label><input class="field" id="username" maxlength="20" value="${esc(state.name)}"><button class="btn" onclick="rename()">名前を保存</button><div class="item row"><span>会員ランク</span><span class="gold">${memberTier().name}</span></div><div class="item row"><span>月間順位（サンプル）</span><span class="gold">#12</span></div><div class="item row"><span>ポイント</span><span class="gold">${state.points} PT</span></div><div class="item row"><span>来店回数（デモ）</span><span>${state.visits}回</span></div>`)}${card('MY MENU',`<button class="btn secondary" onclick="go('vip')">NUTS VIPを見る →</button> <button class="btn secondary" onclick="go('quest')">クエストを見る →</button> <button class="btn secondary" onclick="go('checkin')">来店QR会員証 →</button>`)}${card('MY ACTIVITY',`<div class="item row"><span>気になるイベント</span><strong class="gold">${state.bookings.length} 件</strong></div><button class="btn secondary" onclick="go('events')">イベントを見る →</button> <button class="btn secondary" onclick="go('history')">来店履歴を見る →</button>`)}${card('デモ設定',`<p class="notice">試作データを初期化します。店舗のデータには影響しません。</p><button class="btn secondary" onclick="resetDemo()">デモデータを初期化</button>`)}`}
function rename(){let n=$('#username').value.trim();if(!n)return notify('名前を入力してね');state.name=n;save();notify('名前を保存しました');render()}function resetDemo(){if(!confirm('この端末のデモデータを初期化しますか？'))return;localStorage.removeItem(KEY);location.reload()}
const tabs=[['home','⌂','HOME'],['rank','♜','RANK'],['live','◉','LIVE'],['match','♧','MATCH'],['player','♙','MY PAGE']];function render(){let pages={home,rank,live:liveView,quest,match,vip,player,checkin,events:eventView,history:historyView};$('#view').innerHTML=pages[page]();$('#nav').innerHTML=tabs.map(([id,ic,name])=>`<button class="tab ${page===id?'active':''}" onclick="go('${id}')"><b>${ic}</b><span>${name}</span></button>`).join('')}render();
</script><script src="/bridge.js"></script></body></html>
