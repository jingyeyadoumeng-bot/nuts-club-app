<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUTS CLUB</title><style>*{box-sizing:border-box}body{margin:0;background:#08090b;color:#eee6d3;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:520px;margin:auto;padding:35px 20px}header{text-align:center;color:#d6b76d;letter-spacing:5px}h1{font-size:38px;margin:12px 0}header p{font-size:11px;color:#96815c}.panel{background:#141414;border:1px solid #554425;border-radius:16px;padding:22px;margin-top:30px}input,button{display:block;width:100%;margin:12px 0;padding:14px;border-radius:9px;font-size:16px}input{background:#222;border:1px solid #5c5039;color:white}button{border:0;background:linear-gradient(100deg,#a78445,#f0d594,#ad8749);color:#18110a;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#292622;color:#e8cb89;border:1px solid #695734}.link{color:#d8bc78;text-decoration:underline;cursor:pointer}.card{border:1px solid #c5a461;border-radius:20px;background:linear-gradient(135deg,#39301f,#0a0b0d 65%,#2d281c);padding:25px;margin:30px 0;min-height:220px;box-shadow:0 20px 50px #0008}.small{font-size:11px;letter-spacing:3px;color:#d5b36a}.tier{font-size:30px;letter-spacing:3px;margin:40px 0 15px;font-weight:800}.uid{font-size:10px;color:#b4aa92;overflow-wrap:anywhere}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{border:1px solid #5b4828;padding:18px;border-radius:12px;background:#171512}.stat b{display:block;font-size:27px;color:#e5c581;margin-top:8px}#message{color:#d6b76d;overflow-wrap:anywhere}[hidden]{display:none!important}</style></head><body><div class="wrap"><header><div class="small">THE MEMBERSHIP EXPERIENCE</div><h1>NUTS CLUB</h1><p>MEMBERS ONLY · BLACK & GOLD</p></header><section id="login" class="panel"><h2>会員ログイン</h2><input id="email" type="email" autocomplete="email" placeholder="メールアドレス"><input id="password" type="password" autocomplete="current-password" placeholder="パスワード（6文字以上）"><input id="displayName" placeholder="会員表示名" hidden><button id="submit">ログイン</button><p><span id="switch" class="link">新規会員登録はこちら</span></p></section><section id="member" hidden><div class="card"><div class="small">NUTS CLUB ✦ VIP MEMBER</div><div id="tier" class="tier">BRONZE</div><div id="name"></div><p class="uid" id="uid"></p></div><div class="stats"><div class="stat">保有ポイント<b id="points">0</b></div><div class="stat">預かりチップ<b id="chips">0</b></div></div><div class="panel"><p>ポイント・チップ・ランクは店舗スタッフが管理します。</p><button id="reload" class="secondary">最新情報に更新</button><button id="logout" class="secondary">ログアウト</button></div></section><p id="message" role="status"></p></div><script src="app.js"></script></body></html>
